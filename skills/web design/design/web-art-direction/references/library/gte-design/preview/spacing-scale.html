<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4 / 8 / 12 / 16 / 24 / 32 / 48" viewport="700x120" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-default); color: var(--text-high); display: flex; flex-direction: column; gap: 20px; }
  .group-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-low); text-transform: uppercase; letter-spacing: 0.08em; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .s { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sq { background: var(--accent); border-radius: 2px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-mid); }
</style></head>
<body>
  <div>
    <div class="group-label">Core scale · used in product</div>
    <div class="row" style="margin-top:8px">
      <div class="s"><div class="sq" style="width:4px;height:4px"></div><span class="lbl">4 xs</span></div>
      <div class="s"><div class="sq" style="width:8px;height:8px"></div><span class="lbl">8 sm</span></div>
      <div class="s"><div class="sq" style="width:12px;height:12px"></div><span class="lbl">12 md</span></div>
      <div class="s"><div class="sq" style="width:16px;height:16px"></div><span class="lbl">16 lg</span></div>
      <div class="s"><div class="sq" style="width:24px;height:24px"></div><span class="lbl">24 xl</span></div>
      <div class="s"><div class="sq" style="width:32px;height:32px"></div><span class="lbl">32 xxl</span></div>
      <div class="s"><div class="sq" style="width:48px;height:48px"></div><span class="lbl">48 huge</span></div>
    </div>
  </div>
  <div>
    <div class="group-label">Extended scale · marketing material only</div>
    <div class="row" style="margin-top:8px">
      <div class="s"><div class="sq" style="width:56px;height:56px"></div><span class="lbl">56</span></div>
      <div class="s"><div class="sq" style="width:64px;height:64px"></div><span class="lbl">64</span></div>
      <div class="s"><div class="sq" style="width:72px;height:72px"></div><span class="lbl">72</span></div>
      <div class="s"><div class="sq" style="width:96px;height:96px"></div><span class="lbl">96</span></div>
      <div class="s"><div class="sq" style="width:128px;height:128px"></div><span class="lbl">128</span></div>
    </div>
  </div>
</body></html>
