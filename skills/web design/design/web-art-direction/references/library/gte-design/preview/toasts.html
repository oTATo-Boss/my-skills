<!DOCTYPE html>
<!-- @dsCard group="Components" name="Alerts · Toasts" subtitle="Basic / loading / success / error — flat elevated-2 + shadow" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: var(--surface-default); color: var(--text-high); display: grid; gap: 10px; }
.toast {
  background: var(--surface-elevated-2);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-sans);
  box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 0 0 1px var(--stroke-default);
}
.toast .ic { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
.toast .ic.pos { background: var(--positive); color: #010304; }
.toast .ic.neg { background: var(--negative); color: #010304; }
.toast .ic svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.toast .loader { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--white-15); border-top-color: var(--text-high); animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast .txt { display: flex; flex-direction: column; gap: 2px; }
.toast .ti { color: var(--text-high); font-size: 13px; font-weight: 600; line-height: 1.25; }
.toast .sub { color: var(--text-mid); font-size: 12px; line-height: 1.3; }
</style></head>
<body>
<div class="toast"><span class="txt"><span class="ti" style="font-weight: 600">Copied to clipboard</span></span></div>
<div class="toast"><span class="loader"></span><span class="txt"><span class="ti">Submitting order</span></span></div>
<div class="toast"><span class="ic pos"><svg viewBox="0 0 24 24"><polyline points="5 12 10 17 19 7"/></svg></span><span class="txt"><span class="ti">Swap completed</span><span class="sub">Successfully swapped 0.5 ETH to 1,142 USDC</span></span></div>
<div class="toast"><span class="ic neg"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="txt"><span class="ti">Swap failed</span><span class="sub">Not enough balance</span></span></div>
</body></html>
