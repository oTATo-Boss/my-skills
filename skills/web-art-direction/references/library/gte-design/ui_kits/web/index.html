<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Web" name="Web · Trading terminal" subtitle="Full trading screen — header, markets, chart, book, form, positions" viewport="1440x820" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GTE · Trade BTC-USD</title>
<link rel="icon" href="../../assets/logos/gte-logo-white.png">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--surface-elevated-1); color: var(--text-high); overflow: hidden; }
  body { font-family: var(--font-sans); }
  * { box-sizing: border-box; }
  /* Rewrite asset paths relative to project root (colors_and_type.css uses ./fonts/...) */
  img[src^="assets/"] { /* noop */ }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Fix asset paths at load time so components referencing "assets/..." resolve from project root -->
<script>
  // Rewrite relative src tokens in place by absolute-izing them
  window.__ASSET_ROOT = "../../";
</script>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="MarketsSidebar.jsx"></script>
<script type="text/babel" src="MarketTicker.jsx"></script>
<script type="text/babel" src="TradingChart.jsx"></script>
<script type="text/babel" src="OrderBook.jsx"></script>
<script type="text/babel" src="RecentTrades.jsx"></script>
<script type="text/babel" src="OrderForm.jsx"></script>
<script type="text/babel" src="PositionsPanel.jsx"></script>

<script type="text/babel">
  // Patch: asset URLs in our primitives are "assets/..." relative to project root.
  // Since index.html is at ui_kits/web/, prepend "../../". We do this by monkey-patching
  // img src attribute via a MutationObserver-lite; simpler: edit TokenIcon to use ../../
  // and logo references already use ../../ below. For TokenIcon specifically, override:
  const _TokenIcon = window.TokenIcon;
  window.TokenIcon = ({ symbol, size = 20 }) => {
    const map = {
      ETH: "../../assets/tokens/eth.svg", USDC: "../../assets/tokens/usdc.svg",
      USDT: "../../assets/tokens/usdt.svg", BTC: "../../assets/tokens/placeholder.svg",
      SOL: "../../assets/tokens/placeholder.svg",
    };
    return React.createElement("img", { src: map[symbol] || map.BTC, width: size, height: size,
      alt: symbol, style: { borderRadius: "50%", background: "var(--surface-elevated-2)" } });
  };

  // Override Header's logo path
  const _Header = window.Header;
  window.Header = () => {
    const el = _Header();
    return el;
  };

  const App = () => {
    return (
      <div style={{ display: "flex", flexDirection: "column", height: "100vh", width: "100vw" }}>
        <HeaderPatched />
        <div style={{ display: "flex", flex: 1, minHeight: 0 }}>
          <MarketsSidebar />
          <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
            <MarketTicker />
            <div style={{ flex: 1, display: "grid", gridTemplateColumns: "1fr 260px 260px 320px", minHeight: 0, borderBottom: "1px solid var(--stroke-default)" }}>
              <TradingChart height={420} />
              <div style={{ borderLeft: "1px solid var(--stroke-default)", minHeight: 0, overflow: "hidden" }}><OrderBook /></div>
              <div style={{ borderLeft: "1px solid var(--stroke-default)", minHeight: 0, overflow: "hidden" }}><RecentTrades /></div>
              <div style={{ borderLeft: "1px solid var(--stroke-default)", minHeight: 0, overflow: "hidden" }}><OrderForm /></div>
            </div>
            <PositionsPanel />
          </div>
        </div>
      </div>
    );
  };

  // Render Header with patched logo path
  const HeaderPatched = () => {
    const headerEl = Header();
    // Swap logo src recursively
    const patch = (node) => {
      if (!node || typeof node !== "object" || !node.props) return node;
      const { props } = node;
      if (props.src === "assets/logos/gte-logo-white.svg") {
        return React.cloneElement(node, { src: "../../assets/logos/gte-logo-white.svg" });
      }
      if (props.children) {
        const kids = React.Children.map(props.children, patch);
        return React.cloneElement(node, {}, kids);
      }
      return node;
    };
    return patch(headerEl);
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
