<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="Lucide-aligned; bolt + sparkle are signature" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: var(--surface-default); color: var(--text-high); display: grid; grid-template-columns: repeat(8, 1fr); gap: 16px; text-align: center; }
.i { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-mid); }
.i svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.lbl { font-family: var(--font-mono); font-size: 9px; color: var(--text-low); letter-spacing: 0.3px; }
</style></head>
<body>
<!-- Lucide-style icon refs -->
<div class="i"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg><span class="lbl">markets</span></div>
<div class="i"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg><span class="lbl">menu</span></div>
<div class="i" style="color:var(--accent)"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor" stroke="none" style="stroke: rgb(166, 167, 168); fill: rgba(255, 120, 23, 0)"/></svg><span class="lbl">bolt · turbo</span></div>
