<!DOCTYPE html>
<!-- @dsCard group="Marketing" name="Landing hero — light editorial" subtitle="light tokens, two-column, framed image" viewport="1440x760" -->
<!-- MARKETING / NON-PRODUCT — LIGHT theme (data-theme="light" → scoped light tokens). Pins down the light rules:
     - Light canvas = surface-elevated-1 (soft grey, NOT stark-white surface-default), near-black text, black PNG logo.
     - Heading system: Ogg Text Light only, ONE typeface, ONE colour (here near-black). Orange reserved for the primary CTA.
     - Editorial two-column: airy copy left, brand image in a CONTAINED rounded frame right (brand photos are dark/moody,
       so they sit in a frame on light rather than full-bleed).
     - BUTTONS: nav = PRIMARY; no icon on the primary; primary CTA is one button (same copy "Launch app" + size lg as nav).
       Copy sits on the SOLID light canvas (not a photo), so the secondary here is TERTIARY (ghost is only for photo bg).
       Border gradient flips to "to top" so buttons read raised. Orange TEXT (if any) would use --text-accent; here there is none. -->
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  *{box-sizing:border-box}
  /* light canvas = one level darker than the lightest (elevated-1, soft grey) — not stark white */
  body{margin:0;background:var(--surface-elevated-1);color:var(--text-high);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .page{position:relative;min-height:760px;display:flex;flex-direction:column;overflow:hidden}

  nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:24px 56px}
  nav .logo{height:26px;width:auto;display:block}
  .nav-links{display:flex;gap:30px}
  .nav-links a{color:var(--text-mid);font-size:14px;letter-spacing:.1px;text-decoration:none;transition:color .15s}
  .nav-links a:hover{color:var(--text-high)}

  .inner{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1fr 540px;gap:64px;align-items:center;padding:24px 56px 80px}
  .eyebrow{font-size:13px;letter-spacing:.4px;color:var(--text-mid);margin-bottom:22px}
  /* heading = Ogg Text Light only (one typeface, one colour) */
  .headline{font-family:var(--font-display);font-weight:300;font-size:70px;line-height:1.08;letter-spacing:-.01em;color:var(--text-high);margin:0 0 26px}
  .headline .em{font-family:var(--font-display);font-weight:300}
  .sub{font-size:15px;line-height:1.6;color:var(--text-mid);max-width:420px;margin:0 0 34px}
  .cta{display:flex;gap:12px}
  .frame{border-radius:var(--radius-large);overflow:hidden;border:1px solid var(--stroke-subtle);box-shadow:0 28px 64px rgba(1,3,4,.14)}
  .frame img{display:block;width:100%;height:460px;object-fit:cover}

  /* buttons — reuse locked system; adapt to light tokens. primary stays orange */
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-regular);
    font-family:var(--font-sans);font-weight:500;border:0;cursor:pointer;color:var(--text-color,#fff);background:var(--btn-bg,transparent);white-space:nowrap;box-shadow:0 2px 12px 0 var(--shadow-color,transparent)}
  /* LIGHT: border gradient flips to "to top" (dark edge at bottom) so buttons read raised, not inset */
  .btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(to top,var(--bf,transparent),var(--bt,transparent));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .btn svg{width:16px;height:16px;display:block}
  .btn.lg{height:40px;padding:0 22px;font-size:14px;letter-spacing:.2px}
  .btn.sm{height:32px;padding:0 14px;font-size:13px;letter-spacing:.24px}
  .btn.primary{--btn-bg:linear-gradient(65deg,var(--surface-action-primary),var(--surface-action-primary-hover));--text-color:var(--white-200);--bf:var(--stroke-subtle);--bt:var(--stroke-subtle);--shadow-color:var(--orange-40)}
  .btn.tertiary{--btn-bg:var(--surface-action-tertiary);--text-color:var(--text-action-tertiary);--bf:var(--stroke-default);--bt:transparent}
</style></head>
<body>
  <div class="page">
    <nav>
      <img class="logo" src="../assets/logos/gte-logo-black.png" alt="GTE">
      <div class="nav-links"><a>Markets</a><a>Trade</a><a>Portfolio</a><a>Docs</a></div>
      <a class="btn primary lg">Launch app</a>
    </nav>
    <div class="inner">
      <div class="copy">
        <div class="eyebrow">On-chain perps · Turbo orderbook</div>
        <h1 class="headline">Trade perps<br>at <span class="em">terminal speed.</span></h1>
        <p class="sub">A fully on-chain orderbook with the latency of a centralized exchange. Cross-margin, up to 50&times; leverage, and sub-millisecond matching — settled on Turbo.</p>
        <div class="cta">
          <a class="btn primary lg">Launch app</a>
          <a class="btn tertiary lg">Read the docs</a>
        </div>
      </div>
      <div class="frame"><img src="../assets/brand-images/gte_-09 1.jpg" alt="GTE"></div>
    </div>
  </div>
</body></html>
