<!DOCTYPE html>
<!-- @dsCard group="Components" name="Inputs" subtitle="default / hover / focus / error · suffix · numeric" viewport="760x220" -->
<!-- CANONICAL — rebuilt from src/ui/input. Copy-source for inputs. NOTE: inputs are ALWAYS Inter (paragraph-2),
     the one exception to "numbers are mono"; left-aligned; numeric variant has no special surface/align. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--surface-elevated-1);color:var(--text-high);font-family:var(--font-sans)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-low);letter-spacing:.3px;margin:0 0 8px}
  .grid{display:flex;flex-wrap:wrap;gap:22px 28px}
  .cell{display:flex;flex-direction:column;gap:8px}
  /* input — h32, radius 8, surface-input, Inter paragraph-2, +0.28 tracking */
  .inp{display:flex;align-items:center;height:32px;border-radius:var(--radius-regular);background:var(--surface-input);
    border:1px solid transparent;padding:0 8px;font-family:var(--font-sans);font-size:13px;letter-spacing:.28px;color:var(--text-high);width:220px;transition:border-color .1s}
  .inp .ph{color:var(--text-low);transition:color .1s}
  .inp.hv .ph,.inp.fc .ph{color:var(--text-mid)}
  .inp.hv{border-color:var(--stroke-subtle)} .inp.fc{border-color:var(--stroke-strong)}
  .inp.err{border-color:var(--stroke-negative-muted)}
  .inp .suf{margin-left:auto;color:var(--text-mid);font-family:var(--font-sans);font-size:13px}
  .errmsg{color:var(--negative);font-size:11px;margin-top:4px}
  .caret{width:1px;height:14px;background:var(--text-high);display:inline-block;margin-left:1px;animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
</style></head>
<body>
  <div class="grid">
    <div class="cell"><span class="lbl">default / hover / focus</span>
      <div class="inp"><span class="ph">Placeholder</span></div>
      <div class="inp hv"><span class="ph">Placeholder</span></div>
      <div class="inp fc">Input<span class="caret"></span></div>
    </div>
    <div class="cell"><span class="lbl">with suffix · numeric value (still Inter, left) · error</span>
      <div class="inp">0.00<span class="suf">USD</span></div>
      <div class="inp">1,250.00</div>
      <div><div class="inp err">12.30<span class="suf">USDC</span></div><div class="errmsg">Insufficient USDC for margin</div></div>
    </div>
  </div>
</body></html>
